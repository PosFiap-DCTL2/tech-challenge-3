name: flag-service CI

on:
  push:
    branches: ["main"]
    paths:
      - "flag-service/**"
      - ".github/workflows/flagserviceCI.yaml"
      - ".github/workflows/security.yaml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./flag-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest || echo "Sem testes configurados, seguindo."

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./flag-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8

      - name: Run flake8
        run: |
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  check-security:
    uses: ./.github/workflows/security.yaml
    with:
      working-directory: ./flag-service

  publish-image:
    needs: [build, lint, check-security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: ./flag-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        run: |
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker build
        run: |
          echo "Deploying application..."
          docker build -t ${{ steps.login-ecr.outputs.registry }}/flag-service:latest .
          docker build -t ${{ steps.login-ecr.outputs.registry }}/flag-service:${{ env.SHORT_SHA }} .

      - name: Docker push
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/flag-service:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/flag-service:${{ env.SHORT_SHA }}

      - name: Update GitOps Repo
        run: |
          cd ..
          git clone https://${{ secrets.GITOPS_PAT }}@github.com/PosFiap-DCTL2/tech-challenge-3
          cd tech-challenge-3/Kubernetes/flag-service

          COMMIT_HASH=$(echo $GITHUB_SHA | cut -c1-7)
          REGISTRY=${{ steps.login-ecr.outputs.registry }}

          sed -i "s|^\(\s*image:\s*\).*flag-service:.*|\1$REGISTRY/flag-service:$COMMIT_HASH|" deployment.yaml

          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add deployment.yaml
          git commit -m "feat(flag-service): Update da imagem para $COMMIT_HASH" || echo "Nada para commitar"
          git push