# Main CI/CD pipeline workflow for Tech Challenge 3
# add comment
name: targeting-service CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'targeting-service/**'
  workflow_dispatch:
    branches: [ "main" ]
    paths:
      - 'targeting-service/**'

jobs:

  build: 
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./targeting-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          echo "These aren't the tests you're looking for..."
          # To do: add real tests here

  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./targeting-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install pylint
        run: |
          python -m pip install --upgrade pip
          pip install pylint
      
      - name: Run pylint
        run: |
          pylint --disable E0401 --fail-under=8.0 app.py

  check-security:
    uses: ./.github/workflows/security.yaml

  publish-image:
    needs: [build, lint, check-security]
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./targeting-service

    # Only publish Docker image when changes are pushed to the main branch
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        run: |
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Necessário se for conta Academy
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Docker build
        run: |
          echo "Deploying application..."
          docker build -t ${{ steps.login-ecr.outputs.registry }}/targeting-service:latest .
          docker build -t ${{ steps.login-ecr.outputs.registry }}/targeting-service:${{ env.SHORT_SHA }} .

      - name: Docker push
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/targeting-service:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/targeting-service:${{ env.SHORT_SHA }}

      - name: Update GitOps Repo
        run: |
          git clone https://${{ secrets.GITOPS_PAT }}@github.com/PosFiap-DCTL2/tech-challenge-3
          cd tech-challenge-3/Kubernetes/targeting-service

          COMMIT_HASH=$(echo $GITHUB_SHA | cut -c1-7)
          REGISTRY=${{ steps.login-ecr.outputs.registry }}

          sed -i "s|^\(\s*image:\s*\).*targeting-service:.*|\1$REGISTRY/targeting-service:$COMMIT_HASH|" deployment.yaml

          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add deployment.yaml
          git commit -m "feat(targeting-service): Update da imagem para $COMMIT_HASH"
          git push
