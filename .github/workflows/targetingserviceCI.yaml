# Main CI/CD pipeline workflow for Tech Challenge 3

name: Pipeline-CI-targeting-service

on:
  push:
    branches: [ "main" ]
    path:
      - 'targeting-service\app.py'


jobs:

  build: 
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./targeting-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          echo "These aren't the tests you're looking for..."
          # To do: add real tests here

  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./targeting-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install pylint
        run: |
          python -m pip install --upgrade pip
          pip install pylint
      
      - name: Run pylint
        run: |
          pylint --disable E0401 --fail-under=8.0 app.py

  check-security:
    uses: ./.github/workflows/security.yaml

  publish-image:
    needs: [build, lint, check-security]
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./targeting-service

    # Only publish Docker image when changes are pushed to the main branch
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set short SHA
        run: |
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Docker build
        run: |
          echo "Deploying application..."
          docker build -t ${{ steps.login-ecr.outputs.registry }}/targeting-service:latest
          docker build -t ${{ steps.login-ecr.outputs.registry }}/targeting-service:${{ env.SHORT_SHA }}

      - name: Docker push
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/targeting-service:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/targeting-service:${{ env.SHORT_SHA }}
