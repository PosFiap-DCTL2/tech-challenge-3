name: Terraform deploy

on:
  workflow_dispatch:

jobs:
  terraform:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Adicionandos as credenciais AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Initialize Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        working-directory: ./Terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: ./Terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./Terraform
        run: terraform plan

      - name: Terraform Apply
        working-directory: ./Terraform
        run: terraform apply -auto-approve

      - name: Configurar acesso kubectl no EKS
        run: |
          aws eks update-kubeconfig --name clusterpos --region us-east-1

      - name: Instalar ngninx ingress controller
        run: |
          kubectl apply --server-side -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.7.0/deploy/static/provider/aws/deploy.yaml
      
      - name: Instalar ArgoCD (server-side)
        run: |
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          
          kubectl apply \
            --server-side \
            --force-conflicts \
            -n argocd \
            -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

          kubectl patch svc argocd-server -n argocd -p '{"spec": {"type": "LoadBalancer"}}'
  
  Criando-o-authdb:
    runs-on: self-hosted
    needs: terraform
    defaults:
      run:
        working-directory: ./Terraform/Initsql/authdb
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Adicionandos as credenciais AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1   

      - name: Coletar o host do RDS
        id: get-db-host
        run: |
          DB_HOST=$(aws rds describe-db-instances \
            --db-instance-identifier authdb \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)
          echo "DB_HOST=$DB_HOST" >> $GITHUB_ENV

      - name: Instalando o psql
        run: |
          sudo apt-get update
          sudo apt-get install postgresql-client -y

      - name: Run init SQL
        env:
          PGPASSWORD: ${{ secrets.auth_db_password }}
        run: |
          psql \
            -h $DB_HOST \
            -p 5432 \
            -U ${{ secrets.db_user }} \
            -d authdb \
            -f init.sql

  Criando-o-flagsdb:
    runs-on: self-hosted
    needs: terraform
    defaults:
      run:
        working-directory: ./Terraform/Initsql/flagsdb
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Adicionandos as credenciais AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1   

      - name: Coletar o host do RDS
        id: get-db-host
        run: |
          DB_HOST=$(aws rds describe-db-instances \
            --db-instance-identifier flagsdb \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)
          echo "DB_HOST=$DB_HOST" >> $GITHUB_ENV

      - name: Instalando o psql
        run: |
          sudo apt-get update
          sudo apt-get install postgresql-client -y

      - name: Run init SQL
        env:
          PGPASSWORD: ${{ secrets.flags_db_password }}
        run: |
          psql \
            -h $DB_HOST \
            -p 5432 \
            -U ${{ secrets.db_user }} \
            -d flagsdb \
            -f init.sql

  Criando-o-targetingdb:
    runs-on: self-hosted
    needs: terraform
    defaults:
      run:
        working-directory: ./Terraform/Initsql/targetingdb
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Adicionandos as credenciais AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1   

      - name: Coletar o host do RDS
        id: get-db-host
        run: |
          DB_HOST=$(aws rds describe-db-instances \
            --db-instance-identifier targetingdb \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)
          echo "DB_HOST=$DB_HOST" >> $GITHUB_ENV

      - name: Instalando o psql
        run: |
          sudo apt-get update
          sudo apt-get install postgresql-client -y

      - name: Run init SQL
        env:
          PGPASSWORD: ${{ secrets.targeting_db_password }}
        run: |
          psql \
            -h $DB_HOST \
            -p 5432 \
            -U ${{ secrets.db_user }} \
            -d targetingdb \
            -f init.sql
