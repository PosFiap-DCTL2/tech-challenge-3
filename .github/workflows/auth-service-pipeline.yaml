name: CI auth-service

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'auth-service/**'
      - '.github/workflows/auth-service-pipeline.yaml'

  pull_request:
    branches: [main]
    paths:
      - 'auth-service/**'
      - '.github/workflows/auth-service-pipeline.yaml'

env:
  SERVICE_NAME: auth-service
  SERVICE_PATH: auth-service
  AWS_REGION: us-east-1

jobs:
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./auth-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: auth-service/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build application
        run: go build ./...

      - name: Run unit tests
        run: go test ./... -v

  lint:
    name: Linting
    runs-on: ubuntu-latest
    needs: build-test

    defaults:
      run:
        working-directory: ./auth-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: auth-service/go.sum

      - name: Check formatting with gofmt
        run: |
          test -z "$(gofmt -l .)"

      - name: Run go vet
        run: go vet ./...

  scan-seguranca-sca:
    name: Scan de Segurança - SCA
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: 'auth-service'
          vuln-type: library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  scan-seguranca-sast:
    name: Scan de Segurança - SAST
    runs-on: ubuntu-latest
    needs: lint

    defaults:
      run:
        working-directory: ./auth-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: auth-service/go.sum

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: gosec ./...

  build-push-docker-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs:
      - scan-seguranca-sca
      - scan-seguranca-sast

    defaults:
      run:
        working-directory: ./auth-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Define image tag
        run: echo "IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/auth-service:${{ env.IMAGE_TAG }} .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/auth-service:${{ env.IMAGE_TAG }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push Docker image to Amazon ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/auth-service:${{ env.IMAGE_TAG }}

      - name: Logout of Amazon ECR
        if: always()
        run: docker logout ${{ steps.login-ecr.outputs.registry }}