name: Run All Pipelines

on:
  workflow_dispatch:

jobs:
  trigger-auth-service:
    name: Trigger auth-service Pipeline
    runs-on: self-hosted
    steps:
      - name: Trigger auth-service-pipeline
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'auth-service-pipeline.yaml',
              ref: context.ref
            })

  trigger-analytics-service:
    name: Trigger analytics-service Pipeline
