name: CI auth-service

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  SERVICE_NAME: auth-service
  AWS_REGION: us-east-1
  GO_VERSION: '1.21'

jobs:
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Run unit tests
        run: go test ./... -v

  lint:
    name: Linting
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check Go formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Go vet
        run: go vet ./...

  Scan-de-Seguranca-SCA:
    name: Scan-de-Seguranca (SCA)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Software Composition Analysis - Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: '.'
          vuln-type: library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

  Scan-de-Seguranca-SAST:
    name: Scan-de-Seguranca (SAST)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Static Application Security Testing - gosec
        run: gosec ./...

  Build-Push-Docker-Image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [Scan-de-Seguranca-SCA, Scan-de-Seguranca-SAST]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Adicionando as credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construindo imagem Docker
        run: |
          COMMIT_HASH=$(echo $GITHUB_SHA | cut -c1-7)
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ env.SERVICE_NAME }}:${{ github.sha }} .

      - name: Container Scan - Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Push Docker image to Amazon ECR
        run: |
          COMMIT_HASH=$(echo $GITHUB_SHA | cut -c1-7)
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Logout of Amazon ECR
        if: always()
        run: docker logout ${{ steps.login-ecr.outputs.registry }}
